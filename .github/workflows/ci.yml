name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # macos-26 is the newest stable macOS image; use its default Xcode
    # instead of hardcoding a path.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check the icon is current
        run: ./scripts/make-icon.sh verify

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build app bundle
        run: ./build.sh

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP=build/LimitPeek.app
          archs="$(lipo -archs "$APP/Contents/MacOS/LimitPeek")"
          echo "architectures: ${archs}"
          # Apple silicon only: the binary must be arm64, nothing else.
          if [[ "$archs" != "arm64" ]]; then
            echo "::error::expected an arm64-only binary, got: ${archs}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          # The test bundle must never end up in the shipped app: it carries the
          # API fixtures.
          if find "$APP" -name '*Tests*' -print -quit | grep -q .; then
            echo "::error::test artifacts found inside $APP"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/LimitPeek.app dist/LimitPeek.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LimitPeek-${{ github.sha }}
          path: dist/LimitPeek.zip
          retention-days: 14
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck build.sh scripts/*.sh

      # Pinned: verify the checksum before extracting or running the binary.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tarball="${work}/actionlint.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$work" actionlint
          "$work/actionlint" -color

  release-scripts:
    name: Smoke-test release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # These decide what a release is called and what it says, so a break has
      # to surface here rather than mid-release.
      - name: Exercise version and notes generation
        run: |
          set -euo pipefail
          echo "latest:      $(scripts/version.sh latest)"
          echo "next (auto): $(scripts/version.sh next auto)"
          echo "app-changed: $(scripts/version.sh app-changed || true)"
          scripts/release-notes.sh "$(scripts/version.sh next auto)" >> "$GITHUB_STEP_SUMMARY"
